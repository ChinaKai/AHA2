<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican wearing a blue helmet rides a teal bicycle along a sunny seaside path.</desc>

  <defs>
    <clipPath id="scene-clip">
      <rect width="1200" height="800" rx="28"/>
    </clipPath>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g clip-path="url(#scene-clip)">
    <!-- Sky and distant coast -->
    <rect width="1200" height="800" fill="#dff4f2"/>
    <circle cx="1010" cy="120" r="58" fill="#ffd166"/>
    <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".9">
      <path d="M90 150c28-27 57-27 85 0 28-27 57-27 85 0"/>
      <path d="M350 96c22-21 44-21 66 0 22-21 44-21 66 0"/>
      <path d="M760 175c24-23 48-23 72 0 24-23 48-23 72 0"/>
    </g>
    <path d="M0 352c150-48 287-42 420 18 122 55 251 62 389 20 148-45 278-36 391 6v128H0z" fill="#76c7c5"/>
    <path d="M0 401c155-38 290-25 405 39 125 70 278 73 459 11 119-41 231-35 336 18v77H0z" fill="#1f9da6" opacity=".58"/>

    <!-- Coastal vegetation -->
    <g stroke="#347f62" stroke-width="9" stroke-linecap="round">
      <path d="M86 498l-24-103m27 103 19-124m-8 91 47-75"/>
      <path d="M1090 505l-20-112m20 112 24-132m-12 91 45-73"/>
    </g>
    <g fill="#d7a94d">
      <ellipse cx="60" cy="391" rx="12" ry="25" transform="rotate(-17 60 391)"/>
      <ellipse cx="108" cy="371" rx="12" ry="25" transform="rotate(8 108 371)"/>
      <ellipse cx="148" cy="389" rx="12" ry="25" transform="rotate(33 148 389)"/>
      <ellipse cx="1069" cy="391" rx="12" ry="25" transform="rotate(-10 1069 391)"/>
      <ellipse cx="1115" cy="371" rx="12" ry="25" transform="rotate(10 1115 371)"/>
      <ellipse cx="1148" cy="389" rx="12" ry="25" transform="rotate(31 1148 389)"/>
    </g>

    <!-- Path -->
    <path d="M0 528c243-34 441-25 594 25 181 59 383 59 606 0v247H0z" fill="#f5d8a8"/>
    <path d="M0 699c236 25 427 16 573-27 206-61 415-55 627 18v110H0z" fill="#e8b978"/>
    <path d="M0 548c218-26 392-14 523 36" fill="none" stroke="#fff5db" stroke-width="12" stroke-linecap="round" stroke-dasharray="55 34"/>

    <!-- Motion marks -->
    <g fill="none" stroke="#176d78" stroke-width="9" stroke-linecap="round" opacity=".42">
      <path d="M70 558h126"/>
      <path d="M104 597h156"/>
      <path d="M910 544h153"/>
      <path d="M962 584h106"/>
    </g>

    <!-- Ground shadow -->
    <ellipse cx="620" cy="698" rx="342" ry="33" fill="#5d6a64" opacity=".2" filter="url(#soft-shadow)"/>

    <!-- Bicycle wheels -->
    <g fill="none" stroke="#233741">
      <circle cx="363" cy="617" r="126" stroke-width="15"/>
      <circle cx="874" cy="617" r="126" stroke-width="15"/>
      <circle cx="363" cy="617" r="106" stroke="#ffffff" stroke-width="4" opacity=".65"/>
      <circle cx="874" cy="617" r="106" stroke="#ffffff" stroke-width="4" opacity=".65"/>
    </g>
    <g stroke="#6c7b80" stroke-width="4" opacity=".72">
      <path d="M363 503v228M249 617h228M282 536l162 162M282 698l162-162"/>
      <path d="M874 503v228M760 617h228M793 536l162 162M793 698l162-162"/>
    </g>
    <g fill="#dbe5e6" stroke="#233741" stroke-width="8">
      <circle cx="363" cy="617" r="18"/>
      <circle cx="874" cy="617" r="18"/>
