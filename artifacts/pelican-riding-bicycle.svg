    <path d="M574 438c-25 54-32 104-19 148l61 82" fill="none" stroke="#f0a23a" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M612 667h43" fill="none" stroke="#d7812c" stroke-width="15" stroke-linecap="round"/>

    <!-- Pelican body and neck -->
    <path d="M491 246c-46 32-72 86-69 147 3 58 34 104 90 132 50 25 122 9 153-39 25-39 24-94-3-131-31-43-69-46-91-72-18-21-38-49-80-37z" fill="#fffdf7" stroke="#263b43" stroke-width="10" stroke-linejoin="round"/>
    <path d="M486 271c-44 5-81 38-96 83-14 42-7 93 21 122 17 18 43 24 62 9 21-16 21-49 15-76-8-40-8-85 12-118z" fill="#edf5f3" stroke="#263b43" stroke-width="9"/>

    <!-- Wing -->
    <path d="M480 344c54-23 119 9 140 65 14 37 1 72-35 83-54 17-111-31-105-148z" fill="#d8ebe8" stroke="#263b43" stroke-width="9"/>
    <path d="M501 380c28 10 51 32 67 68m-42-83c31 13 57 34 74 63" fill="none" stroke="#9fcac6" stroke-width="8" stroke-linecap="round"/>

    <!-- Front leg -->
    <path d="M601 459c33 44 56 84 69 120l46-20" fill="none" stroke="#f0a23a" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M700 563h40" fill="none" stroke="#d7812c" stroke-width="15" stroke-linecap="round"/>

    <!-- Pelican head -->
    <ellipse cx="500" cy="232" rx="90" ry="82" fill="#fffdf7" stroke="#263b43" stroke-width="10"/>

