    <path d="M423 225c2-74 49-116 112-102 42 9 66 41 65 91-61-18-119-14-177 11z" fill="#246cb7" stroke="#263b43" stroke-width="10" stroke-linejoin="round"/>
    <path d="M441 174c32-24 70-28 108-12" fill="none" stroke="#79b9e8" stroke-width="12" stroke-linecap="round"/>
    <path d="M590 208l43 4" fill="none" stroke="#263b43" stroke-width="11" stroke-linecap="round"/>
    <path d="M446 223c6 28 15 48 32 63" fill="none" stroke="#263b43" stroke-width="9" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="533" cy="219" r="14" fill="#ffffff" stroke="#263b43" stroke-width="7"/>
    <circle cx="538" cy="219" r="5" fill="#263b43"/>
    <circle cx="542" cy="215" r="2.5" fill="#ffffff"/>

    <!-- Beak and pouch -->
    <path d="M554 245c79-32 177-25 255 16-80 31-166 38-252 23z" fill="#f4a63b" stroke="#263b43" stroke-width="10" stroke-linejoin="round"/>
    <path d="M559 284c74 3 154-7 232-27-39 66-117 85-203 55-17-6-28-15-29-28z" fill="#f7c35a" stroke="#263b43" stroke-width="9" stroke-linejoin="round"/>
    <path d="M779 262l30-1" fill="none" stroke="#d97f2b" stroke-width="7" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M568 291c18 11 37 14 57 8" fill="none" stroke="#c86d2d" stroke-width="5" stroke-linecap="round"/>

    <!-- Wings gripping handlebars -->
    <path d="M603 384c57-10 115-3 176 22" fill="none" stroke="#fffdf7" stroke-width="30" stroke-linecap="round"/>
    <path d="M603 384c57-10 115-3 176 22" fill="none" stroke="#263b43" stroke-width="9" stroke-linecap="round"/>
    <path d="M770 406c15-3 25 2 31 16" fill="none" stroke="#f0a23a" stroke-width="18" stroke-linecap="round"/>

    <!-- Tail feathers -->
    <path d="M425 430c-40 9-68 29-85 59 36-5 69-16 98-34m4 10c-28 21-45 44-50 69 33-14 59-34 77-61" fill="#fffdf7" stroke="#263b43" stroke-width="9" stroke-linejoin="round"/>

    <!-- Small front basket with fish -->
    <path d="M811 432h119l-17 91h-84z" fill="#c97a3d" stroke="#263b43" stroke-width="9" stroke-linejoin="round"/>
    <path d="M823 454h96m-91 25h86m-80 24h75" fill="none" stroke="#f1b06d" stroke-width="7"/>
    <path d="M851 440c20-35 52-37 77-4-26 11-51 13-77 4z" fill="#65b7c2" stroke="#263b43" stroke-width="7"/>
    <circle cx="915" cy="433" r="3.5" fill="#263b43"/>
    <path d="M850 440l-22-15v29z" fill="#65b7c2" stroke="#263b43" stroke-width="7" stroke-linejoin="round"/>

    <!-- Foreground pebbles -->
    <g fill="#c8905c" opacity=".7">
      <ellipse cx="166" cy="716" rx="22" ry="8"/>
      <ellipse cx="1043" cy="726" rx="30" ry="9"/>
      <ellipse cx="1118" cy="663" rx="18" ry="6"/>
    </g>
  </g>

  <rect x="5" y="5" width="1190" height="790" rx="24" fill="none" stroke="#263b43" stroke-width="10"/>
