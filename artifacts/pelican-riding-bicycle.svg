      <path d="M756 396l45 35"/>
      <path d="M510 425l-24-61"/>
      <path d="M454 363h82"/>
    </g>
    <g fill="#f4fbfa" stroke="#233741" stroke-width="7">
      <circle cx="666" cy="617" r="31"/>
      <circle cx="666" cy="617" r="11" fill="#233741"/>
