name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test Web
        run: |
          node scripts/build-web.mjs
          node --test web/tests/build.test.mjs

      - name: Embed Web assets
        run: |
          rm -rf internal/webassets/dist
          mkdir -p internal/webassets/dist
          cp -R web/dist/. internal/webassets/dist/

      - name: Test Go
        run: |
          go test ./...
          go vet ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "$os" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/aha2-${os}-${arch}${suffix}" ./cmd/aha
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/aha-sync-linux-${arch}" ./cmd/aha-sync
          done
          cd dist
          sha256sum aha2-* aha-sync-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "AHA2 ${GITHUB_REF_NAME}"
