# Packaging and publishing only: the tag must be verified locally before it is
# pushed (Web build, Go/plugin tests and vet, and the real package build). CI
# does not run the test suite again; a tag that reaches this workflow is
# already considered verified, so the only failures expected here are build or
# packaging problems.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      # One packaging path for local builds and Release: the package script
      # builds Web, server, tray and the Feishu plugin, stages the pinned Node
      # runtime and browser host, and writes release-manifest.json. The
      # installer below consumes that exact tree, so the manifest describes the
      # bytes that end up installed.
      - name: Build Windows package
        shell: bash
        run: |
          set -euo pipefail
          GO_BIN=go bash scripts/build-windows-package.sh --version "$GITHUB_REF_NAME" --output-dir dist/package

      - name: Build Windows Setup
        shell: powershell
        run: |
          .\scripts\test-windows-installer.ps1 -RepoPath $PWD
          $package = Join-Path $PWD "dist\package"
          $plugin = Join-Path $package "plugins\feishu\windows-amd64"
          .\scripts\build-windows-installer.ps1 -RepoPath $PWD -InputExe (Join-Path $package "aha2-windows-amd64.exe") -InputTrayExe (Join-Path $package "aha2-tray-windows-amd64.exe") -InputBrowserHost (Join-Path $package "browser-host") -InputNodeExe (Join-Path $package "node\node.exe") -InputNodeLicense (Join-Path $package "node\LICENSE") -InputFeishuPlugin (Join-Path $plugin "aha2-channel-feishu.exe") -InputFeishuManifest (Join-Path $plugin "plugin.json") -InputManifest (Join-Path $package "release-manifest.json") -ExpectedCommit $env:GITHUB_SHA -OutputDir (Join-Path $PWD "dist\installer") -Version $env:GITHUB_REF_NAME

      # Assemble the official PackageDir layout the deploy skill consumes:
      #   <PackageDir>\dist\release-manifest.json and package files
      #   <PackageDir>\installer\AHA2-Setup-User-x64.exe
      # A GitHub Release holds one archive plus the standalone per-platform
      # assets, so ship the layout as a zip and keep the installer exe asset
      # unchanged. The shared assembler writes file entries only; directory
      # metadata is rejected by the archive verifier in the publish job.
      - name: Assemble deployable Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/assemble-windows-package.py --package-dir dist/package --installer-dir dist/installer --output dist/AHA2-Windows-Package-x64.zip

      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item -Path "dist\installer\AHA2-Setup-User-x64.exe" -Destination "release-assets" -Force
          Copy-Item -Path "dist\AHA2-Windows-Package-x64.zip" -Destination "release-assets" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: release-assets/*
          if-no-files-found: error

  build-linux-packages:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build embedded Web
        run: |
          npm ci --prefix web
          node scripts/build-web.mjs
          rm -rf internal/webassets/dist
          mkdir -p internal/webassets/dist
          cp -R web/dist/. internal/webassets/dist/

      - name: Build Linux applications
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          web_version="$(bash scripts/web-version.sh "$version")"
          mkdir -p dist/package-input
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.goarch }}" go build -trimpath -ldflags="-s -w -X main.version=$version -X main.webVersion=$web_version" -o "dist/package-input/aha2-${{ matrix.goarch }}" ./cmd/aha
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.goarch }}" go build -trimpath -ldflags="-s -w" -o "dist/package-input/aha-sync-${{ matrix.goarch }}" ./cmd/aha-sync

      - name: Build DEB and RPM
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-linux-packages.sh
          bash scripts/test-linux-sync-packages.sh
          bash scripts/build-linux-packages.sh --version "$GITHUB_REF_NAME" --arch "${{ matrix.goarch }}" --input-exe "dist/package-input/aha2-${{ matrix.goarch }}" --output-dir dist/release
          bash scripts/build-linux-sync-packages.sh --version "$GITHUB_REF_NAME" --arch "${{ matrix.goarch }}" --input-exe "dist/package-input/aha-sync-${{ matrix.goarch }}" --output-dir dist/release

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.goarch }}
          path: |
            dist/release/*.deb
            dist/release/*.rpm
          if-no-files-found: error

  build-macos-packages:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded Web
        run: |
          npm ci --prefix web
          node scripts/build-web.mjs
          rm -rf internal/webassets/dist
          mkdir -p internal/webassets/dist
          cp -R web/dist/. internal/webassets/dist/

      - name: Build macOS application
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          web_version="$(bash scripts/web-version.sh "$version")"
          mkdir -p dist/package-input
          CGO_ENABLED=0 GOOS=darwin GOARCH="${{ matrix.goarch }}" go build -trimpath -ldflags="-s -w -X main.version=$version -X main.webVersion=$web_version" -o "dist/package-input/aha2-${{ matrix.goarch }}" ./cmd/aha

      - name: Build macOS PKG
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-macos-packages.sh
          bash scripts/build-macos-packages.sh --version "$GITHUB_REF_NAME" --arch "${{ matrix.goarch }}" --input-exe "dist/package-input/aha2-${{ matrix.goarch }}" --output-dir dist/release

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.goarch }}
          path: dist/release/*.pkg
          if-no-files-found: error

  publish-release:
    needs: [build-windows-installer, build-linux-packages, build-macos-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v5
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Verify packaged-only release and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if find dist -maxdepth 1 -type f \( -name 'aha2-linux-*' -o -name 'aha2-windows-*' -o -name 'aha2-darwin-*' -o -name 'aha-sync-*' \) | grep -q .; then
            echo "Release contains a forbidden portable binary." >&2
            exit 1
          fi
          for package in \
            AHA2-Setup-User-x64.exe \
            "aha2_${version}_amd64.deb" "aha2_${version}_arm64.deb" \
            "aha2-${version}-1.x86_64.rpm" "aha2-${version}-1.aarch64.rpm" \
            "aha2-sync_${version}_amd64.deb" "aha2-sync_${version}_arm64.deb" \
            "aha2-sync-${version}-1.x86_64.rpm" "aha2-sync-${version}-1.aarch64.rpm" \
            AHA2-macos-amd64.pkg AHA2-macos-arm64.pkg \
            AHA2-Windows-Package-x64.zip; do
            test -f "dist/${package}" || { echo "Missing release package: ${package}" >&2; exit 1; }
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12
          # The Windows archive must be the official PackageDir layout: the
          # per-user installer under installer/ and the complete package,
          # including release-manifest.json, under dist/. The verifier rejects
          # an empty manifest, missing required scope and any dist/ file the
          # manifest does not cover, and re-checks every hash against the
          # archive bytes.
          python3 scripts/verify-windows-package-archive.py "dist/AHA2-Windows-Package-x64.zip" --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS
          test -s SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "AHA2 ${GITHUB_REF_NAME}"
