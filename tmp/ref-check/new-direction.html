<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:linear-gradient(135deg,#eef7ff,#f8fbff);font-family:"Microsoft YaHei",system-ui,sans-serif;color:#17324d}
h1{font-size:22px;margin:0 0 4px}.sub{margin:0 0 16px;color:#60758d;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #dbe8f7;border-radius:18px;padding:14px;box-shadow:0 14px 34px rgba(31,86,132,.1)}
.card h2{font-size:16px;margin:0 0 2px}.card p{margin:0 0 10px;color:#60758d;font-size:12px}
.ref{width:100%;height:230px;object-fit:contain;border-radius:12px;background:#f7fbff}
.ours{display:grid;place-items:center;height:170px;margin-top:10px;border-top:1px dashed #d7e6f6}
.ours .assistant-pet{position:relative!important;width:150px!important;height:150px!important;transition:none!important}
.ours .assistant-pet-art,.ours .pet-svg{width:150px!important;height:150px!important}
.caption{font-size:11px;color:#7a8ba0;text-align:center;margin-top:2px}
.footer{margin-top:16px;font-size:13px;color:#38516d;background:#fff;border:1px dashed #b9d4ef;border-radius:14px;padding:11px 14px}
/* Assistant character skins and the in-panel picker. */
.assistant-pet-art { position: relative; display: block; width: 64px; height: 64px; }
.assistant-pet-art .pet-svg { display: block; width: 64px; height: 64px; overflow: visible; filter: drop-shadow(0 7px 9px rgba(31,86,132,.22)); }
.assistant-pet-art .pet-ground { fill: rgba(15,35,60,.16); }
.assistant-pet-art .pet-main { fill: #8bd3ff; }
.assistant-pet-art .pet-whale-body { fill: #4d6bfe; }
.assistant-pet-art .pet-whale-belly { fill: #eaf0ff; }
.assistant-pet-art .pet-whale-tail, .assistant-pet-art .pet-whale-fin { fill: #3b55d9; }
.assistant-pet-art .pet-whale-smile { fill: none; stroke: #10233d; stroke-width: 2; stroke-linecap: round; }
.assistant-pet-art .pet-whale-spout { fill: none; stroke: #9adcff; stroke-width: 3; stroke-linecap: round; opacity: 0; }
.assistant-pet-art .pet-duck-body { fill: #ffd84d; }
.assistant-pet-art .pet-duck-wing { fill: #f4c21c; }
.assistant-pet-art .pet-duck-tail { fill: #f4c21c; }
.assistant-pet-art .pet-duck-tuft { fill: none; stroke: #f4c21c; stroke-width: 3; stroke-linecap: round; }
.assistant-pet-art .pet-duck-beak { fill: #ff9f1c; }
.assistant-pet-art .pet-duck-beak-line { fill: none; stroke: #d97b00; stroke-width: 1.3; stroke-linecap: round; }
.assistant-pet-art .pet-duck-foot { fill: none; stroke: #ff9f1c; stroke-width: 3.5; stroke-linecap: round; }
.assistant-pet-art .pet-eyes-open { fill: #10233d; animation: pet-blink-open 6s infinite; }
.assistant-pet-art .pet-eyes-closed { fill: none; stroke: #10233d; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: pet-blink-closed 6s infinite; }
.assistant-pet-art .pet-mouth { fill: none; stroke: #10233d; stroke-width: 2; stroke-linecap: round; }
.assistant-pet-art .pet-cheek { fill: #ff9db2; opacity: .62; }
.assistant-pet-art .pet-body-group { transform-origin: 50% 86%; animation: pet-breathe 3.8s ease-in-out infinite; }
.assistant-pet[data-character="gugugaga"] .pet-duck-wing { transform-origin: 19px 39px; animation: pet-wing 3.1s ease-in-out infinite; }
.assistant-pet[data-character="gugugaga"] .pet-duck-tail { transform-origin: 14px 38px; animation: pet-tail-small 2.9s ease-in-out infinite; }
.assistant-pet[data-character="gugugaga"] .pet-duck-beak { transform-origin: 32px 35px; animation: pet-beak 5.2s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-tail { transform-origin: 52px 36px; animation: pet-tail 2.6s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-fin { transform-origin: 21px 46px; animation: pet-fin 3.4s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-spout { animation: pet-spout 8s ease-in-out infinite; }
.assistant-pet.walking .assistant-pet-art { animation: pet-walk .44s ease-in-out infinite; }
.assistant-pet.thinking .assistant-pet-art { animation: pet-think .8s ease-in-out infinite; }
.assistant-pet.has-hint .assistant-pet-art { animation: pet-alert .78s ease-in-out infinite; }
.assistant-pet.panel-open .assistant-pet-art { animation: pet-perk 2s ease-in-out infinite; }
.assistant-pet.character-changed .assistant-pet-art { animation: pet-pop .7s ease-out; }
.assistant-character-button { position: relative; display: grid; flex: 0 0 auto; width: 32px; height: 32px; min-height: 32px; padding: 0; place-items: center; border: 1px solid #dbe8f7; border-radius: 10px; background: #f4f9ff; }
.assistant-character-button:hover { border-color: #9fc4ee; background: #eaf4ff; }
.assistant-character-mini { display: grid; width: 100%; height: 100%; place-items: center; }
.assistant-character-mini .pet-svg { width: 25px; height: 25px; overflow: visible; }
.assistant-character-badge { position: absolute; right: 0; bottom: -1px; color: #2563eb; font-size: 9px; line-height: 1; }
.assistant-character-menu { position: absolute; top: 56px; right: 10px; z-index: 6; display: grid; gap: 8px; width: 264px; max-width: calc(100% - 20px); padding: 10px; border: 1px solid #dbe8f7; border-radius: 13px; background: #fff; box-shadow: 0 16px 40px rgba(15,35,60,.2); }
.assistant-character-menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 1px 2px 3px; }
.assistant-character-menu-head strong { font-size: 12px; }
.assistant-character-menu-head small { color: var(--muted); font-size: 10px; }
.assistant-character-options { display: grid; gap: 5px; }
.assistant-character-option { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px; border: 1px solid transparent; border-radius: 10px; background: #f8fbff; text-align: left; }
.assistant-character-option:hover { border-color: #c7dcf4; background: #eef7ff; }
.assistant-character-option.active { border-color: #7eb2e8; background: #e8f3ff; }
.assistant-character-preview { display: grid; flex: 0 0 auto; width: 42px; height: 42px; place-items: center; border-radius: 10px; background: #fff; }
.assistant-character-preview .pet-svg { width: 38px; height: 38px; overflow: visible; }
.assistant-character-copy { display: grid; gap: 1px; min-width: 0; }
.assistant-character-copy strong { font-size: 12px; }
.assistant-character-copy small { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.assistant-identity .assistant-mini-avatar .pet-svg { width: 26px; height: 26px; overflow: visible; }

@keyframes pet-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.015); } }
@keyframes pet-blink-open { 0%, 92%, 100% { opacity: 1; } 94%, 96% { opacity: 0; } }
@keyframes pet-blink-closed { 0%, 92%, 100% { opacity: 0; } 94%, 96% { opacity: 1; } }
@keyframes pet-wing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
@keyframes pet-beak { 0%, 88%, 100% { transform: scaleY(1); } 91%, 94% { transform: scaleY(.55); } }
@keyframes pet-tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }
@keyframes pet-tail-small { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
@keyframes pet-fin { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
@keyframes pet-spout { 0%, 72%, 100% { opacity: 0; transform: translateY(2px) scaleY(.7); } 78%, 86% { opacity: 1; transform: translateY(0) scaleY(1); } }
@keyframes pet-walk { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
@keyframes pet-think { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
@keyframes pet-alert { 0%, 100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-5px) scale(1.04); } }
@keyframes pet-perk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pet-pop { 0% { transform: scale(.82); } 55% { transform: scale(1.1) rotate(-3deg); } 100% { transform: scale(1); } }

@media (max-width: 720px) {
  .assistant-pet-art, .assistant-pet-art .pet-svg { width: 58px; height: 58px; }
  .assistant-character-menu { right: 8px; width: 244px; }
  .assistant-character-button { width: 30px; height: 30px; min-height: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  .assistant-pet-art, .assistant-pet-art .pet-body-group, .assistant-pet-art .pet-eyes-open,
  .assistant-pet-art .pet-eyes-closed, .assistant-pet-art .pet-whale-tail, .assistant-pet-art .pet-whale-fin,
  .assistant-pet-art .pet-whale-spout, .assistant-pet-art .pet-duck-wing, .assistant-pet-art .pet-duck-tail,
  .assistant-pet-art .pet-duck-beak { animation: none !important; }
}

/* Anime chibi skins: Gugugaga penguin girl and DeepSeek whale girl. */
.pet-gugu-foot { stroke: #ffc21c; }
.pet-gugu-beak { transform-origin: 32px 24px; }
.pet-gugu-hood { fill: #23272e; }
.assistant-pet[data-character="gugugaga"] .pet-gugu-flipper { transform-origin: 32px 52px; animation: pet-wing 3.1s ease-in-out infinite; }
.assistant-pet[data-character="gugugaga"] .pet-gugu-beak { animation: pet-beak 5.2s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-tail { transform-origin: 47px 50px; animation: pet-tail 2.6s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-fin-ear { transform-origin: 32px 36px; animation: pet-fin 3.4s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-hair { transform-origin: 32px 42px; animation: pet-hair 4.2s ease-in-out infinite; }
.assistant-pet[data-character="deepseek_fish"] .pet-whale-ahoge { transform-origin: 32px 10px; animation: pet-ahoge 2.8s ease-in-out infinite; }
@keyframes pet-hair { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.2deg); } }
@keyframes pet-ahoge { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(8deg); } }

</style></head><body>
