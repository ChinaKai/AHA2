<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:26px;background:linear-gradient(135deg,#eef7ff,#f8fbff);font-family:system-ui;display:flex;gap:36px}
.card{background:#fff;border:1px solid #dbe8f7;border-radius:18px;padding:18px;box-shadow:0 14px 34px rgba(31,86,132,.1);display:grid;place-items:center;gap:8px;width:150px}
.pet{position:relative;width:96px;height:96px;display:grid;place-items:center}
.pet img{height:96px;width:auto;filter:drop-shadow(0 8px 10px rgba(31,86,132,.25))}
.pet video{height:96px;width:auto;max-width:none}
strong{font-size:13px}small{font-size:10px;color:#7a8ba0}
</style></head><body>
<div class="card"><div class="pet"><img src="gugu-3d.png"></div><strong>咕咕嘎嘎</strong><small>3D 原版</small></div>
<div class="card"><div class="pet"><video src="whale-idle.webm" autoplay muted loop playsinline></video></div><strong>大肥鱼</strong><small>原版桌宠视频</small></div>
</body></html>
