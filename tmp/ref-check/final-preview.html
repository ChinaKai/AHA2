<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:linear-gradient(135deg,#eef7ff,#f8fbff);font-family:system-ui;color:#17324d}
.row{display:flex;gap:36px;align-items:flex-start}
.card{background:#fff;border:1px solid #dbe8f7;border-radius:18px;padding:16px;box-shadow:0 14px 34px rgba(31,86,132,.1);width:220px;text-align:center}
.pet{height:96px;display:grid;place-items:center;margin-bottom:6px}
.pet img{height:96px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 7px 9px rgba(31,86,132,.22))}
.menu{width:280px;background:#fff;border:1px solid #dbe8f7;border-radius:14px;padding:10px;box-shadow:0 14px 34px rgba(31,86,132,.14)}
.opt{display:flex;align-items:center;gap:9px;padding:7px;border:1px solid transparent;border-radius:10px;background:#f8fbff;margin:5px 0}
.opt.active{border-color:#7eb2e8;background:#e8f3ff}
.prev{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.prev img{max-height:38px;max-width:38px;width:auto;height:auto;object-fit:contain}
.copy{display:grid;text-align:left}.copy strong{font-size:12px}.copy small{font-size:10px;color:#7a8ba0}
</style></head><body><div class="row">
<div class="card"><div class="pet"><img src="gugu-3d.png"></div><strong>咕咕嘎嘎</strong><div style="font-size:11px;color:#7a8ba0">3D 原版</div></div>
<div class="card"><div class="pet"><img src="fish-3d.png"></div><strong>DeepSeek 大肥鱼</strong><div style="font-size:11px;color:#7a8ba0">原版鲸鱼娘</div></div>
<div class="menu"><div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 4px 6px"><strong>换个形象</strong><small style="color:#7a8ba0">只改外观</small></div>
<div class="opt active"><span class="prev"><img src="gugu-3d.png"></span><span class="copy"><strong>咕咕嘎嘎</strong><small>3D 原版企鹅娘</small></span></div>
<div class="opt"><span class="prev"><img src="fish-3d.png"></span><span class="copy"><strong>DeepSeek 大肥鱼</strong><small>原版鲸鱼娘</small></span></div>
</div></div></body></html>
