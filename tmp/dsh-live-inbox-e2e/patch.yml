- id: llm-pi-ai
  config:
    providers:
      mock:
        displayName: Live Inbox Mock
        api: openai-completions
        baseURL: "http://127.0.0.1:18768/v1"
        apiKeyEnv: MOCK_API_KEY
        models:
          - id: "mock-model"
            contextWindow: 100000
            reasoningEfforts:
              off: off
              low: low
              medium: medium
              high: high
- id: agent-default-model
  config:
    provider: mock
    model: "mock-model"
- id: session-title-llm
  disabled: true
- id: approval
  config:
    policy: never
- insert:
    - id: aha-live-inbox
      name: "/home/kaikai/kk-workspace/my_project/AHA2/internal/backend/aha_live_inbox.mjs"
